---
- hosts: devops
  become: yes
  become_method: sudo

  tasks:
    - name: Install apache2
      package:
        name: apache2
        state: present

    - name: Install python3-apt
      package:
        name: python3-apt
        state: present

    - name: Copy Apache site config
      copy:
        src: files/config/apache.conf
        dest: /etc/apache2/sites-available/000-defualt.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy website index
      copy:
        src: files/site/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Enable Apache site configuration via symlink
      file:
        src: /etc/apache2/sites-available/000-default.conf
        dest: /etc/apache2/sites-enabled/000-default.conf
        state: link

    - name: Restart Apache service
      service:
        name: apache2
        state: restarted
